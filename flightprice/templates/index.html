<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>機票比價</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    form { display: grid; gap: 12px; }
    label { display: flex; flex-direction: column; font-size: 0.9rem; gap: 4px; }
    input[type="text"], input[type="date"], input[type="number"] {
      box-sizing: border-box; width: 100%;
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-width: 0; }
    .row label { min-width: 0; }
    .checkbox { flex-direction: row; align-items: center; gap: 8px; }
    button { padding: 10px; font-size: 1rem; border: none; border-radius: 4px; background: #2563eb; color: white; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: #b91c1c; background: #fee2e2; padding: 8px 12px; border-radius: 4px; }
    .autocomplete { position: relative; }
    .suggestions {
      display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
      margin: 2px 0 0; padding: 4px 0; list-style: none;
      background: white; border: 1px solid #ccc; border-radius: 4px;
      max-height: 220px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,.08);
    }
    .suggestions.show { display: block; }
    .suggestions li { padding: 8px 10px; font-size: 0.9rem; cursor: pointer; }
    .suggestions li:hover { background: #eff6ff; }
    .suggestions .code { font-weight: 600; margin-right: 6px; }
    .suggestions .muted { color: #777; }
  </style>
</head>
<body>
  <h1>✈️ 機票比價</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <div class="row">
      <label class="autocomplete">出發地（城市中英文名稱或 IATA 代碼）
        <input type="text" name="origin" id="origin" placeholder="台北 / Taipei / TPE" required autocomplete="off">
        <ul class="suggestions" id="origin-suggestions"></ul>
      </label>
      <label class="autocomplete">目的地（城市中英文名稱或 IATA 代碼）
        <input type="text" name="destination" id="destination" placeholder="東京 / Tokyo / NRT" required autocomplete="off">
        <ul class="suggestions" id="destination-suggestions"></ul>
      </label>
    </div>
    <div class="row">
      <label>去程日期
        <input type="date" name="depart_date" required>
      </label>
      <label>回程日期（單程留空）
        <input type="date" name="return_date">
      </label>
    </div>
    <div class="row">
      <label>人數
        <input type="number" name="adults" value="1" min="1">
      </label>
      <label>幣別
        <input type="text" name="currency" value="TWD" maxlength="3">
      </label>
    </div>
    <label class="checkbox" style="flex-direction: row;">
      <input type="checkbox" name="non_stop" value="1"> 只看直飛
    </label>
    <button type="submit">查詢</button>
  </form>

  <script>
    // Offline airport lookup (no API calls) so autocomplete never touches
    // the Skyscanner free-tier request quota.
    let AIRPORT_INDEX = null;

    async function loadAirportIndex() {
      const res = await fetch('/airports.json');
      const data = await res.json();
      const byIata = {};
      data.airports.forEach((a) => { byIata[a.iata] = a; });
      AIRPORT_INDEX = { airports: data.airports, aliasesZh: data.aliases_zh, byIata };
    }

    function searchAirports(index, qRaw) {
      const q = qRaw.trim();
      if (!q) return [];
      const qUpper = q.toUpperCase();
      const qLower = q.toLowerCase();
      const seen = new Set();
      const results = [];

      function add(iata, score) {
        if (seen.has(iata)) return;
        const a = index.byIata[iata];
        if (!a) return;
        seen.add(iata);
        results.push({ ...a, score });
      }

      if (index.byIata[qUpper]) add(qUpper, 0);

      for (const [zh, codes] of Object.entries(index.aliasesZh)) {
        if (zh.includes(q) || q.includes(zh)) {
          const score = zh === q ? 1 : 2;
          codes.forEach((c) => add(c, score));
        }
      }

      index.airports.forEach((a) => {
        if (a.iata.startsWith(qUpper)) add(a.iata, 3);
      });

      index.airports.forEach((a) => {
        if ((a.city && a.city.toLowerCase().includes(qLower)) ||
            (a.name && a.name.toLowerCase().includes(qLower))) {
          add(a.iata, 4);
        }
      });

      results.sort((a, b) => a.score - b.score);
      return results.slice(0, 8);
    }

    function setupAutocomplete(inputId, listId) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(listId);

      function render(results) {
        list.innerHTML = '';
        if (!results.length) {
          list.classList.remove('show');
          return;
        }
        results.forEach((a) => {
          const li = document.createElement('li');
          li.innerHTML = `<span class="code">${a.iata}</span>${a.city || a.name}` +
            `<span class="muted"> ・ ${a.name}${a.country ? ', ' + a.country : ''}</span>`;
          li.addEventListener('mousedown', (e) => {
            e.preventDefault();
            input.value = a.iata;
            list.classList.remove('show');
          });
          list.appendChild(li);
        });
        list.classList.add('show');
      }

      input.addEventListener('input', () => {
        if (!AIRPORT_INDEX) return;
        render(searchAirports(AIRPORT_INDEX, input.value));
      });
      input.addEventListener('blur', () => {
        setTimeout(() => list.classList.remove('show'), 150);
      });
    }

    loadAirportIndex().then(() => {
      setupAutocomplete('origin', 'origin-suggestions');
      setupAutocomplete('destination', 'destination-suggestions');
    });
  </script>
</body>
</html>
